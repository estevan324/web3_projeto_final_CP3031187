<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar Código</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="h4 font-weight-normal">Verificar Código</h2>
            <p class="text-muted small">Um código de 6 dígitos foi enviado para o seu e-mail.</p>
        </div>

        <div id="mensagem-erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-verify">
            <input type="hidden" id="email" name="email">

            <div class="mb-3">
                <label for="code" class="form-label fw-bold">Código de Verificação</label>
                <input type="text" class="form-control text-center fs-4 letter-spacing" id="code" name="code"
                    placeholder="000000" maxlength="6" required>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold" id="btn-submit">Verificar e Entrar</button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="text-decoration-none small">Voltar e tentar outro e-mail</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const emailDaUrl = params.get('email');

        if (emailDaUrl) {
            document.getElementById('email').value = emailDaUrl;
        } else {
            window.location.href = '/';
        }

        document.getElementById('form-verify').addEventListener('submit', async function (event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const code = document.getElementById('code').value;
            const erroEl = document.getElementById('mensagem-erro');
            const btnSubmit = document.getElementById('btn-submit');

            erroEl.classList.add('d-none');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Verificando...";

            try {
                const response = await fetch('/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });

                const data = await response.json();

                if (response.ok && data.sucesso) {
                    sessionStorage.setItem('jwt_token', data.token);
                    window.location.href = '/dashboard';
                } else {
                    erroEl.textContent = data.mensagem || "Erro ao validar o código.";
                    erroEl.classList.remove('d-none');
                }
            } catch (error) {
                erroEl.textContent = "Erro de conexão com o servidor.";
                erroEl.classList.remove('d-none');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Verificar e Entrar";
            }
        });
    </script>
</body>

</html>
