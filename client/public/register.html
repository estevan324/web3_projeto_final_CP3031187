<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">Meu Sistema</a>
            <div class="d-flex">
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
            <div class="text-center mb-4">
                <h2 class="h4 font-weight-normal">Completar Perfil</h2>
                <p class="text-muted small">Informe seu nome e o perfil de acesso desejado.</p>
            </div>

            <form action="/update-profile" method="POST" id="form-register">

                <input type="hidden" id="token" name="token">

                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Nome Completo</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Digite seu nome"
                        required>
                </div>

                <div class="mb-4">
                    <label for="role" class="form-label fw-bold">Perfil de Acesso</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="" disabled selected>Selecione um perfil...</option>
                        <option value="ROLE_CUSTOMER">Cliente (Customer)</option>
                        <option value="ROLE_ADMINISTRATOR">Administrador (Administrator)</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar e Continuar</button>
            </form>
        </div>
    </div>

    <script>
        const tokenValido = sessionStorage.getItem('jwt_token');

        if (!tokenValido) {
            window.location.href = '/';
        } else {
            document.getElementById('token').value = tokenValido;
        }

        function logout() {
            sessionStorage.removeItem('jwt_token');
            window.location.href = '/';
        }
    </script>
</body>

</html>
