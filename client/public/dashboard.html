<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/dashboard">Meu Sistema</a>
            <div class="d-flex">
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h2 class="mb-4 fw-bold text-dark">Bem-vindo ao Dashboard</h2>

                <div class="d-flex justify-content-center gap-3 mb-4">
                    <button class="btn btn-success fw-bold" onclick="testProtectedEndpoint()">
                        <i class="bi bi-shield-lock me-1"></i> Testar Endpoint Protegido
                    </button>
                    <button class="btn btn-primary fw-bold" onclick="getMyProfile()">
                        <i class="bi bi-person-badge me-1"></i> Meu Perfil
                    </button>
                </div>

                <div class="card text-start shadow-sm d-none" id="result-card">
                    <div class="card-header fw-bold bg-white" id="result-title">Resultado</div>
                    <div class="card-body bg-light p-0" id="result-content">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('jwt_token');

        if (!token) {
            window.location.href = '/';
        }

        function logout() {
            sessionStorage.removeItem('jwt_token');
            window.location.href = '/';
        }

        function renderResult(title, htmlContent, isError = false) {
            const card = document.getElementById('result-card');
            const titleEl = document.getElementById('result-title');
            const contentEl = document.getElementById('result-content');

            card.classList.remove('d-none');
            titleEl.textContent = title;
            titleEl.className = `card-header fw-bold ${isError ? 'text-danger' : 'text-success'}`;

            contentEl.innerHTML = htmlContent;
        }

        async function testProtectedEndpoint() {
            try {
                const response = await fetch('/api/protected', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.text();
                renderResult('Resposta de /api/protected', `<p class="p-3 mb-0">${data}</p>`, !response.ok);

            } catch (error) {
                renderResult('Erro na Requisição', `<p class="p-3 mb-0">${error.message}</p>`, true);
            }
        }

        async function getMyProfile() {
            try {
                const response = await fetch('/api/me', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();

                    const rolesHtml = data.roles.map(role =>
                        `<span class="badge bg-primary me-1">${role}</span>`
                    ).join('');

                    const nomeExibicao = data.name ? data.name : '<span class="text-warning fst-italic">Não informado</span>';

                    const profileHtml = `
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item bg-light">
                                <small class="text-muted d-block">ID do Usuário</small>
                                <span class="fw-bold" style="font-family: monospace;">${data.id}</span>
                            </li>
                            <li class="list-group-item bg-light">
                                <small class="text-muted d-block">Nome</small>
                                <span class="fw-bold">${nomeExibicao}</span>
                            </li>
                            <li class="list-group-item bg-light">
                                <small class="text-muted d-block">E-mail</small>
                                <span class="fw-bold">${data.email}</span>
                            </li>
                            <li class="list-group-item bg-light">
                                <small class="text-muted d-block mb-1">Permissões (Roles)</small>
                                ${rolesHtml}
                            </li>
                        </ul>
                    `;

                    renderResult('Dados do Perfil', profileHtml);
                } else {
                    const errorText = await response.text();
                    renderResult('Erro de Acesso', `<p class="p-3 mb-0">${errorText}</p>`, true);
                }
            } catch (error) {
                renderResult('Erro na Requisição', `<p class="p-3 mb-0">${error.message}</p>`, true);
            }
        }
    </script>
</body>

</html>
