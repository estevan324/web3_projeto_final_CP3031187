<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Meu Sistema</a>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Sair</button>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 80vh;">
        <div class="text-center">
            <i class="bi bi-cone-striped text-warning" style="font-size: 6rem;"></i>
            <h1 class="mt-3 fw-bold text-dark">Dashboard em Construção</h1>
            <p class="text-muted fs-5">Estamos preparando novidades incríveis para você. Volte em breve!</p>
            <div class="spinner-border text-primary mt-3" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
        </div>
    </div>

    <script>
        const token = sessionStorage.getItem('jwt_token');

        if (!token) {
            window.location.href = '/';
        }

        function logout() {
            sessionStorage.removeItem('jwt_token');
            window.location.href = '/';
        }
    </script>

</body>

</html>
