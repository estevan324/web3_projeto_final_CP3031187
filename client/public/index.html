<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Solicitar Código</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="h4 font-weight-normal">Acesso ao Sistema</h2>
            <p class="text-muted">Informe seu e-mail para receber o código de acesso.</p>
        </div>

        <form action="/send-code" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="nome@exemplo.com"
                    required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Código</button>
        </form>
    </div>

    <script>
        const tokenAtivo = sessionStorage.getItem('jwt_token');

        if (tokenAtivo) {
            window.location.href = '/dashboard';
        }
    </script>
</body>

</html>
